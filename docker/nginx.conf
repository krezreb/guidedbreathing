server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Single-page application: unknown paths serve the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed assets can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx's default mime map has no .wav entry, and the completion sound must
    # be served as audio rather than as an opaque download. Regex locations are
    # matched ahead of prefix ones, so the cache header is repeated here.
    location ~* \.wav$ {
        types { }
        default_type audio/wav;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Entry points must never be cached, or clients pin themselves to a stale
    # build (TECH_SPECS §18.1).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }
}
